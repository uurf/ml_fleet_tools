# ============================================================
# Show config TEMPLATE
#
# Don't edit this file directly. On site, run:
#     ./ml_show.sh init
# which prompts for these values and writes shows/<id>.conf.
#
# To do it by hand instead: copy this file to shows/<ID>.conf
# (e.g. shows/KAGAMI_BLUE.conf), fill in the values, then:
#     ./ml_show.sh use <ID>
#
# Required: SHOW_SSID, SHOW_WIFI_PASSWORD, SHOW_WIFI_SECURITY,
#           SHOW_PACKAGE, SHOW_BRIGHTNESS, SHOW_DATA_DIR,
#           SHOW_DISK_WARN_PCT. The rest are optional.
# ============================================================

# Human-readable name (defaults to the file/id if omitted)
SHOW_NAME="KAGAMI_BLUE"

# WiFi the headsets join during provisioning
SHOW_SSID="KAGAMI_BLUE"
SHOW_WIFI_PASSWORD="changeme"
SHOW_WIFI_SECURITY="wpa2"

# Show app package (this show's build)
SHOW_PACKAGE="com.tindrum.kagamu"

# Screen brightness (raw value for `settings put system
# screen_brightness`). Read by provision (apply + check) and
# status (display + --fix). Required.
SHOW_BRIGHTNESS="12"

# Top-level dir under /sdcard/ that the show APK reads from.
# Required.
SHOW_DATA_DIR="Kagami"

# Entries under /sdcard/$SHOW_DATA_DIR/ that must be present
# (typically just the asset dir copied from the SSD). Missing
# any of these => dashboard "data files missing". Optional;
# defaults to "data".
SHOW_DATA_REQUIRED="data"

# Entries under /sdcard/$SHOW_DATA_DIR/ that the show APK
# creates at runtime — logs, caches, registered apriltag config.
# Absence is fine. Anything found that isn't in REQUIRED or
# OPTIONAL is flagged as extraneous. Optional; defaults to
# "applogs textures config.json marker-space-config.json".
SHOW_DATA_OPTIONAL="applogs textures config.json marker-space-config.json"

# Disk usage % threshold for the dashboard's red flag.
# Required.
SHOW_DISK_WARN_PCT="60"

# Optional compliance baselines for ml_status.sh.
# Leave blank to skip; set to flag drifted devices red.
SHOW_EXPECTED_APK=""
SHOW_EXPECTED_OS=""

# Expected kiosk (com.tindrum.kiosk) versionName for this show. The kiosk
# package is shared across shows but built per show with a distinct
# version (e.g. 1.0r / 1.0b) so a mis-loaded kiosk is caught. Blank skips.
SHOW_KIOSK_VERSION=""

# Packages from OTHER shows to uninstall when provisioning this show
# (space-separated). E.g. a BLUE device removes the RED show app. Applied
# only in the provision pass, never in --check. Blank = remove nothing extra.
SHOW_REMOVE_PACKAGES=""

# Google Apps Script web app URL for this show's tracking sheet.
# Each workbook has its own bound Apps Script + deployment (see
# apps_script/Code.gs header for the per-workbook procedure).
# Blank = no sheet sync for this show — update_sheet() silently no-ops.
SHOW_SHEETS_URL=""

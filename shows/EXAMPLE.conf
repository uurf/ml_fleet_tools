# ============================================================
# Show config TEMPLATE
#
# Don't edit this file directly. On site, run:
#     ./ml_show.sh init
# which prompts for these values and writes shows/<id>.conf.
#
# To do it by hand instead: copy this file to shows/<ID>.conf
# (e.g. shows/KAGAMI_BLUE.conf), fill in the values, then:
#     ./ml_show.sh use <ID>
#
# Required: SHOW_SSID, SHOW_WIFI_PASSWORD, SHOW_WIFI_SECURITY,
#           SHOW_PACKAGE. The rest are optional.
# ============================================================

# Human-readable name (defaults to the file/id if omitted)
SHOW_NAME="KAGAMI_BLUE"

# WiFi the headsets join during provisioning
SHOW_SSID="KAGAMI_BLUE"
SHOW_WIFI_PASSWORD="changeme"
SHOW_WIFI_SECURITY="wpa2"

# Show app package (this show's build)
SHOW_PACKAGE="com.tindrum.kagamu"

# Optional compliance baselines for ml_status.sh.
# Leave blank to skip; set to flag drifted devices red.
SHOW_EXPECTED_APK=""
SHOW_EXPECTED_OS=""

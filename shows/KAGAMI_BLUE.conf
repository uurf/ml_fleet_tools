SHOW_NAME="KAGAMI_BLUE"

SHOW_SSID="KAGAMI-BLUE"
SHOW_WIFI_PASSWORD="KAGAmius"
SHOW_WIFI_SECURITY="wpa2"

SHOW_PACKAGE="com.tindrum.kagami.blue"

# Packages to uninstall when provisioning BLUE (space-separated): the RED show
# app (foreign show) + the obsolete com.tindrum.kagamu.
SHOW_REMOVE_PACKAGES="com.tindrum.kagami.red com.tindrum.kagamu"

SHOW_BRIGHTNESS="12"

SHOW_DATA_DIR="Kagami"
SHOW_DATA_REQUIRED="data"
SHOW_DATA_OPTIONAL="applogs textures config.json marker-space-config.json"
SHOW_DISK_WARN_PCT="60"

# Show-app APK versionName string, NOT a package name (that's SHOW_PACKAGE).
# Blank = skip the check (real BLUE show-app version not pinned yet).
SHOW_EXPECTED_APK=""
SHOW_EXPECTED_OS="1.4.1"

# Kiosk: shared package built per show as "1.Xb" (BLUE) / "1.Xr" (RED).
# SHOW_KIOSK_SUFFIX ("b") is always enforced (catches a RED kiosk on a BLUE
# device, even mid-churn). SHOW_KIOSK_VERSION is the exact drift check — blank
# during build churn; pin to the current build (e.g. "1.3b") once stable.
SHOW_KIOSK_SUFFIX="b"
SHOW_KIOSK_VERSION=""

SHOW_SHEETS_URL="https://script.google.com/macros/s/AKfycbwF301VZqlntJlUhVVZK-6XFyVm7FAwMhXtwt7wlDPPhxQn6cfnGkOY2-0mSooAr9s/exec"

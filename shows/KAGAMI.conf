# ============================================================
# Show config: KAGAMI  (original Tin Drum show)
#
# Sourced by lib/show_config.sh. Values mirror what was
# hardcoded in ml_provision.sh / ml_status.sh before the
# multi-show split — behavior for this show is unchanged.
# ============================================================

SHOW_NAME="KAGAMI"

# WiFi the headsets join during provisioning
SHOW_SSID="KAGAMI"
SHOW_WIFI_PASSWORD="KAGAmius"
SHOW_WIFI_SECURITY="wpa2"

# Show app package (the per-show build). NOTE: com.tindrum.kagamu is the
# OBSOLETE app — superseded by com.tindrum.kagami.red; it's scrubbed below.
SHOW_PACKAGE="com.tindrum.kagami.red"

# Packages to uninstall when provisioning KAGAMI/RED (space-separated):
# the BLUE show app (foreign show) + the obsolete com.tindrum.kagamu.
SHOW_REMOVE_PACKAGES="com.tindrum.kagami.blue com.tindrum.kagamu com.tindrum.anark com.tindrum.medusa com.tindrum.thelife"

# Screen brightness (raw value passed to `settings put system
# screen_brightness`). Both ml_provision.sh (apply + check) and
# ml_status.sh (status + --fix) read this. Drift = flagged red.
# Required; lib/show_config.sh hard-stops if unset.
SHOW_BRIGHTNESS="12"

# Top-level directory under /sdcard/ that the show APK reads from
# (e.g. /sdcard/Kagami/...). Required.
SHOW_DATA_DIR="Kagami"

# Required entries under /sdcard/$SHOW_DATA_DIR/. Missing any of
# these is dashboard trouble. Optional; defaults to "data".
SHOW_DATA_REQUIRED="data"

# Optional entries under /sdcard/$SHOW_DATA_DIR/ — files and dirs
# the show APK creates at runtime (logs, runtime caches,
# registered apriltag config). Their absence is fine: a
# bench-provisioned device that has not run the show yet won't
# have them. Anything found under the data dir that is NOT in
# SHOW_DATA_REQUIRED ∪ SHOW_DATA_OPTIONAL counts as extraneous.
# Optional; defaults to
# "applogs textures config.json marker-space-config.json".
SHOW_DATA_OPTIONAL="applogs textures config.json marker-space-config.json"

# Disk-usage threshold (percent of /sdcard used). Anything above
# this is a dashboard red flag — a clean device with the show
# installed sits well below 50%, so 60% catches duplicated content
# / log buildup before it crashes the show. Required.
SHOW_DISK_WARN_PCT="60"

# Optional compliance baselines for ml_status.sh.
# Leave blank to skip the check (matches prior behavior).
SHOW_EXPECTED_APK="0.1"
SHOW_EXPECTED_OS="1.4.1"

# Kiosk versioning. The kiosk is ONE shared package (com.tindrum.kiosk) built
# per show as "1.Xr" (RED) / "1.Xb" (BLUE): suffix = show, X = build.
#  - SHOW_KIOSK_SUFFIX: the show marker ("r" here). ml_status ALWAYS enforces
#    that the device kiosk versionName ends with it → catches a BLUE kiosk on a
#    RED device even mid-churn. Keep set.
#  - SHOW_KIOSK_VERSION: EXACT versionName for drift/build checks. Blank during
#    build churn (skip drift); pin to the current build (e.g. "1.3r") once
#    builds stabilize.
SHOW_KIOSK_SUFFIX="r"
SHOW_KIOSK_VERSION="1.0r"

# Google Apps Script web app for the KAGAMI workbook
# ("Kagami Osaka - Device tracker" → tab "Kagami Osaka - Device status").
# update_sheet() in ml_provision.sh / ml_os_flash.sh POSTs here. Blank =
# no sheet sync for this show. See apps_script/Code.gs for the receiving
# script; each workbook has its own bound copy + deployment URL.
SHOW_SHEETS_URL="https://script.google.com/macros/s/AKfycbwUeUL8yk89AWxX_NN6HhCh-vo1MRbnbxHbiTPbvcyhRttiVQOywnrRMH-J9uBPg7Tz/exec"
